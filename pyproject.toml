[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-steward-squad"
version = "0.1.0"
description = "ECC-style multi-agent steward team for DataHub metadata governance"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Vishal R B" }]
keywords = ["datahub", "mcp", "metadata", "governance", "agents", "hackathon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
datahub-steward-squad = "datahub_steward_squad.cli:main"

[tool.setuptools.packages.find]
include = ["datahub_steward_squad*"]
